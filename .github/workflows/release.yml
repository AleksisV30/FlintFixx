name: Release FlintFix Client

# Builds the FlintFix mod jars and the Windows setup exe, then publishes them
# as a GitHub Release (the download link players get, and what auto-update reads).
# Run it from the Actions tab ("Run workflow") or push a tag like v1.7.0.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: "FlintFix-Fabric-v56-four-new-mods (3)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "FlintFix-Fabric-v56-four-new-mods (3)/package-lock.json"

      # One jar per Minecraft version (Stonecutter), collected into build/libs/all
      # and bundled into the installer by electron-builder's extraResources.
      - name: Build mod jars
        working-directory: "FlintFix-Fabric-v56-four-new-mods (3)/flintfix-mod"
        run: chmod +x gradlew && ./gradlew --no-daemon buildAll

      - name: Check mod jars
        run: |
          count=$(ls flintfix-mod/build/libs/all/*.jar | grep -v -- '-sources\.jar$' | wc -l)
          echo "Built $count mod jars"
          [ "$count" -gt 0 ] || { echo "No mod jars were built; refusing to ship an installer without them."; exit 1; }

      - run: npm ci

      - name: Build setup exe and publish the release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: FlintFix-Client-Setup
          path: |
            FlintFix-Fabric-v56-four-new-mods (3)/release-out/*.exe
            FlintFix-Fabric-v56-four-new-mods (3)/release-out/latest.yml
