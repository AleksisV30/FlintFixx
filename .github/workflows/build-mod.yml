name: Build FlintFix mod

on:
  push:
    paths:
      - "FlintFix-Fabric-v56-four-new-mods (3)/flintfix-mod/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "FlintFix-Fabric-v56-four-new-mods (3)/flintfix-mod"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # One jar per Minecraft version (Stonecutter), collected into build/libs/all.
      - name: Build
        run: chmod +x gradlew && ./gradlew --no-daemon buildAll
      - uses: actions/upload-artifact@v4
        with:
          name: flintfix-mod
          path: "FlintFix-Fabric-v56-four-new-mods (3)/flintfix-mod/build/libs/all/*.jar"
