name: Build FlintFix mod

on:
  push:
    paths:
      - "FlintFix-Fabric-v56-four-new-mods (3)/flintfix-mod/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "FlintFix-Fabric-v56-four-new-mods (3)/flintfix-mod"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: flintfix-mod-1.21.1
          path: "FlintFix-Fabric-v56-four-new-mods (3)/flintfix-mod/build/libs/*.jar"
